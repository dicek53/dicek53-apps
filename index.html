<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dicek53 apps</title>
<style>
:root { --bg: #f7f7f5; --surface: #ffffff; --text: #1d1f24; --text2: #5b6068; --line: #d9dbe0; --accent: #2b5fa8; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --surface: #1c1f25; --text: #e6e7ea; --text2: #a3a8b1; --line: #33373f; --accent: #8ab4f8; }
}
body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
main { max-width: 760px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
p.lead { color: var(--text2); margin: 0 0 1.5rem; }
.app { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
.app h2 { font-size: 1.15rem; margin: 0 0 .3rem; }
.app p { margin: .2rem 0; }
.links a { margin-right: 1rem; }
a { color: var(--accent); }
footer { color: var(--text2); font-size: .85rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
<h1>dicek53 apps</h1>
<p class="lead">個人開発アプリの一覧と、各アプリのプライバシーポリシー・サポート窓口です。<br>Apps by dicek53, with privacy policies and support pages.</p>

<section class="app">
<h2>NotaFlow</h2>
<p>五線譜を「読む速さ」を鍛える譜読み練習アプリ(iOS)。<br>A sight-reading trainer that measures how fast you read notation (iOS).</p>
<p class="links"><a href="notaflow/privacy.html">プライバシーポリシー / Privacy Policy</a><a href="notaflow/support.html">サポート / Support</a></p>
</section>

<footer>&copy; dicek53</footer>
</main>
</body>
</html>
